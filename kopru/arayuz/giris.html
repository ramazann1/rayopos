<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <!-- Pencere yalnız kendi klasöründeki dosyaları yükleyebiliyor; internetten
         hiçbir şey çekilmiyor. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' file:" />
    <title>RayoPOS Kasa Köprüsü</title>
    <link rel="stylesheet" href="ortak.css" />
  </head>
  <body>
    <div class="giris-sayfa">
      <header class="ust">
        <img src="../varliklar/simge-128.png" alt="" />
        <div class="ust-ad">
          <strong>RayoPOS</strong>
          <span>Kasa köprüsü</span>
        </div>
        <span class="rozet" id="surum">—</span>
      </header>

      <main class="giris">
        <div class="uyari" id="uyari"></div>

        <section class="kod-kart">
          <div class="baglan-im" data-ikon="bagla" data-boy="26"></div>
          <h2>Bu kasayı bağlayın</h2>
          <p>Aşağıdaki kodu RayoPOS'a yazın</p>

          <div class="haneler" id="haneler"></div>

          <span class="bekleme" id="bekleme">Kod alınıyor</span>
        </section>

        <ol class="adimlar">
          <li><span>RayoPOS'ta <b>Ayarlar → Yazıcılar</b></span></li>
          <li><span><b>Köprü ekle</b> düğmesine basın</span></li>
          <li><span>Yukarıdaki kodu yazın</span></li>
        </ol>
      </main>

      <footer class="alt">
        <span data-ikon="ekran" data-boy="15"></span>
        <span id="bilgisayar">—</span>
      </footer>
    </div>

    <script src="ikon.js"></script>
    <script src="giris.js"></script>
  </body>
</html>
