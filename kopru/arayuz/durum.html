<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' file:" />
    <title>RayoPOS Kasa Köprüsü — Durum</title>
    <link rel="stylesheet" href="ortak.css" />
  </head>
  <body>
    <div class="band">
      <img src="../varliklar/simge-128.png" alt="" />
      <h1>RayoPOS <em>Kasa Köprüsü</em></h1>
      <span class="surum" id="surum">—</span>
    </div>

    <!-- Nabız: pencereyi açan kişinin tek bakışta anlaması gereken cümle.
         Altındaki listeler ayrıntı; buradan çıkarım yapmak zorunda kalmasın. -->
    <div class="nabiz" id="nabiz">
      <span class="isik"></span>
      <div>
        <strong id="nabizBaslik">Bağlanıyor...</strong>
        <span id="nabizAlt">Durum okunuyor</span>
      </div>
    </div>

    <div class="kunye-serit">
      <strong id="isletme">—</strong>
      <em id="kisi"></em>
      <button type="button" id="kodKopyala" class="kod-rozet" hidden></button>
    </div>

    <div class="liste">
      <h2>Bağlantı</h2>
      <div class="satirlar" id="baglantilar"></div>

      <h2 class="baslik-satir">
        Yazıcılar
        <button type="button" id="yeniden" class="yokla" title="Yazıcıları şimdi yokla">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
            <path d="M21 3v5h-5" />
            <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" />
            <path d="M8 16H3v5" />
          </svg>
          Şimdi yokla
        </button>
      </h2>
      <div class="satirlar" id="yazicilar"></div>
    </div>

    <div class="kunye">
      Cihaz <span id="cihaz">—</span>
      <button type="button" id="hepsiniKopyala">Bilgileri Kopyala</button>
    </div>

    <script src="durum.js"></script>
  </body>
</html>
